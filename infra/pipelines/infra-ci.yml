name: infra-ci-$(Date:yyyyMMdd)$(Rev:.r)

trigger:
  branches:
    include:
      - main
  paths:
    include:
      - infra/bicep/**
      - infra/pipelines/infra-ci.yml

pool:
  vmImage: ubuntu-latest

parameters:
  - name: environmentName
    type: string
    default: dev
    values: [dev, qa, prod]

variables:
  # Set these in an Azure DevOps variable group linked to Key Vault.
  - group: gosit-infra-${{ parameters.environmentName }}

steps:
  - task: AzureCLI@2
    displayName: Bicep lint and build
    inputs:
      azureSubscription: $(azureServiceConnection)
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -euo pipefail
        az bicep install
        az bicep build --file infra/bicep/main.bicep --stdout > /dev/null

  - task: AzureCLI@2
    displayName: What-if
    inputs:
      azureSubscription: $(azureServiceConnection)
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -euo pipefail
        az deployment group what-if \
          --resource-group $(resourceGroupName) \
          --template-file infra/bicep/main.bicep \
          --parameters infra/bicep/main.${{ parameters.environmentName }}.bicepparam
    env:
      POSTGRES_ADMIN_PASSWORD: $(postgresAdminPassword)
      KEYVAULT_ADMIN_OBJECT_ID: $(keyVaultAdminObjectId)

  # Deployment is gated behind an Azure DevOps environment approval.
  - task: AzureCLI@2
    displayName: Deploy
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    inputs:
      azureSubscription: $(azureServiceConnection)
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -euo pipefail
        az deployment group create \
          --resource-group $(resourceGroupName) \
          --template-file infra/bicep/main.bicep \
          --parameters infra/bicep/main.${{ parameters.environmentName }}.bicepparam
    env:
      POSTGRES_ADMIN_PASSWORD: $(postgresAdminPassword)
      KEYVAULT_ADMIN_OBJECT_ID: $(keyVaultAdminObjectId)
