name: mobile-ci-$(Date:yyyyMMdd)$(Rev:.r)

trigger:
  branches:
    include:
      - main
  paths:
    include:
      - src/mobile/**
      - infra/pipelines/mobile-ci.yml

variables:
  buildConfiguration: Release

stages:
  - stage: Android
    jobs:
      - job: BuildAndroid
        pool:
          vmImage: ubuntu-latest
        steps:
          - task: UseDotNet@2
            inputs:
              packageType: sdk
              version: 10.0.x
          - script: dotnet workload install maui-android
            displayName: Install MAUI Android workload
          - script: >
              dotnet build src/mobile/GoSit.Mobile/GoSit.Mobile.csproj
              -f net10.0-android -c $(buildConfiguration)
            displayName: Build Android

  - stage: iOS
    dependsOn: []
    jobs:
      - job: BuildiOS
        # iOS requires a macOS agent with Xcode.
        pool:
          vmImage: macos-latest
        steps:
          - task: UseDotNet@2
            inputs:
              packageType: sdk
              version: 10.0.x
          - script: dotnet workload install maui-ios
            displayName: Install MAUI iOS workload
          # Unsigned build until Apple signing certificates are configured in the
          # Azure DevOps secure files library.
          - script: >
              dotnet build src/mobile/GoSit.Mobile/GoSit.Mobile.csproj
              -f net10.0-ios -c $(buildConfiguration)
              /p:CodesignKey=""
            displayName: Build iOS (unsigned)
