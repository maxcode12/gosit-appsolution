    <!--
      Stripe.js must load from Stripe's own domain, not be bundled — that is what keeps
      GoSit out of PCI SAQ D scope. Everything else that can be self-hosted, is: a phone
      with a weak signal to a third-party CDN is a much more common failure than one to
      Stripe or to GoSit's own API, and there is no compliance reason to risk it here.
    -->
    <script src="https://js.stripe.com/v3/"></script>
    <script src="_content/GoSit.Mobile.UI/js/stripe-interop.js"></script>
